<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>QED logo</title>
    <style>
      body {
        border:none;
        margin:0;
        padding:0;
      }
      .initjslogic { padding-right: 0; margin-left: auto; margin-right: auto; }
      div.initjslogic { text-align: center; border: none; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }
    </style>
  </head>
  <body>
    <div style = "position: absolute; top: 0; right: 0; width: 100%; height: 100%; touch-action:none;">
      <canvas id="canvas" width="0" height="0" style="position: absolute; top: 0; left: 0; max-width: 100%; max-height: 100%;">
        Your browser does not support the HTML5 canvas tag.
      </canvas>
    </div>
    <script src="./js/logo.js"></script>
    <script>
      if (this.start_)
        this.start_([], function(_ret) {});
    </script>
  </body>
</html>
